<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a0f2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Flip 7 Score</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <button id="sound-toggle" type="button" class="sound-toggle" aria-label="Mute sounds">🔊</button>
        <h1>Flip 7</h1>
        <p class="subtitle">Score Tracker</p>
        <p id="who-am-i" class="who-am-i hidden"></p>
        <p id="sync-status" class="sync-status" data-kind="ok">Connecting…</p>
      </header>

      <section id="join-banner" class="join-banner hidden" aria-labelledby="join-heading">
        <h2 id="join-heading" class="join-heading">Invite phones on your WiFi</h2>
        <p class="join-hint">localhost only works on this computer. Share this link instead:</p>
        <a id="join-url" class="join-url" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="join-actions">
          <button id="share-join-btn" type="button" class="btn btn-primary">Share link</button>
          <button id="copy-join-btn" type="button" class="btn btn-ghost">Copy link</button>
        </div>
      </section>

      <section id="final-banner" class="final-banner hidden" aria-live="polite">
        <p id="final-text" class="final-text"></p>
        <div class="final-actions">
          <button id="final-btn" type="button" class="btn final-btn"></button>
          <button id="play-again-btn" type="button" class="btn final-btn play-again-btn hidden">Play again</button>
        </div>
      </section>

      <section id="bet-banner" class="bet-banner hidden" aria-live="polite">
        <div class="bet-body">
          <p id="bet-title" class="bet-title"></p>
          <p id="bet-sub" class="bet-sub"></p>
        </div>
        <button id="bet-btn" type="button" class="btn bet-btn"></button>
      </section>

      <div id="roast-banner" class="roast-banner hidden" role="status" aria-live="polite">
        <p id="roast-text" class="roast-text"></p>
        <div class="tone-control">
          <label class="tone-label" for="tone-slider">Comment vibe</label>
          <input
            id="tone-slider"
            class="tone-slider"
            type="range"
            min="0"
            max="2"
            step="1"
            value="1"
            aria-valuetext="Mid"
          />
          <div class="tone-marks" aria-hidden="true">
            <span>Rude</span>
            <span>Mid</span>
            <span>Nice</span>
          </div>
        </div>
      </div>

      <main id="player-list" class="player-list" aria-live="polite"></main>

      <p id="empty-state" class="empty-state hidden">
        Add players to start tracking scores.
      </p>

      <section class="add-player">
        <form id="add-player-form" class="add-player-form">
          <input
            id="player-name-input"
            type="text"
            placeholder="Add a player without a phone"
            autocomplete="off"
            autocapitalize="words"
            enterkeyhint="done"
            maxlength="24"
          />
          <button id="add-player-btn" type="submit" class="btn btn-primary">Add Player</button>
        </form>
      </section>

      <p id="toast" class="toast hidden" role="status" aria-live="polite"></p>

      <footer class="footer">
        <button id="reset-scores-btn" type="button" class="btn btn-ghost" disabled>
          Reset Scores
        </button>
        <button id="reset-names-btn" type="button" class="btn btn-ghost hidden">
          Reset Names
        </button>
        <button id="clear-unused-btn" type="button" class="btn btn-ghost hidden">
          Clear Unused Names
        </button>
        <button id="awards-btn" type="button" class="btn btn-ghost">🏆 Awards</button>
        <button id="new-game-btn" type="button" class="btn btn-ghost" disabled>
          New Game
        </button>
      </footer>
    </div>

    <script src="roasts.js"></script>
    <script src="app.js"></script>
  </body>
</html>
